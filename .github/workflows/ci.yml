name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * 6'
permissions: {}
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
      - run: gem install rufo
      - run: rufo -c .
