name: Test basic usage - valid HTML site
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run proof-html on valid site
        id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/tests/fixtures/valid-site
          check_html: "false"
          check_favicon: "false"
          check_opengraph: "false"
          enforce_https: "false"
          disable_external: "true"
