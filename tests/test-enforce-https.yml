name: Test enforce_https option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run proof-html with enforce_https on site with HTTP links
        id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/tests/fixtures/http-links-site
          check_html: "false"
          check_favicon: "false"
          check_opengraph: "false"
          enforce_https: "true"
          disable_external: "true"
        continue-on-error: true
      - name: Assert action failed due to HTTP link
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when enforce_https=true and HTTP links present, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly enforced HTTPS and failed on HTTP link"
