name: Test broken links detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run proof-html on site with broken links
        id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/tests/fixtures/broken-links-site
          check_html: "false"
          check_favicon: "false"
          check_opengraph: "false"
          enforce_https: "false"
          disable_external: "true"
        continue-on-error: true
      - name: Assert action failed due to broken links
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on broken links, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly detected broken links and failed"
